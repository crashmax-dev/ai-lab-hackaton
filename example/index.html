<html lang="ru">

    3) "SAFETY: RED FLAGS"  — сейчас минимальный список, расширьте его;
    4) разметка вывода и UX — TODO-комментарии подскажут.

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профилактика — локальный LLM</title>
  <style>
    /* TODO: ваши стили здесь */
  </style>
</head>
<body>
  <h1>Личный план профилактики</h1>

  <div id="banner" style="display:none">Обратитесь к врачу (103): тревожные симптомы</div>

  <form id="fh">
    <label>Возраст <input id="age" type="number" value="35" min="1" max="120" required></label>
    <label>Активность
      <select id="activity">
        <option>низкий</option><option selected>средний</option><option>высокий</option>
      </select>
    </label>
    <label><input type="checkbox" name="goal" value="движение"> движение</label>
    <label><input type="checkbox" name="goal" value="питание"> питание</label>
    <label><input type="checkbox" name="goal" value="обследования"> обследования</label>
    <label><input type="checkbox" name="goal" value="сон"> сон</label>
    <label>Жалобы и образ жизни <textarea id="notes"></textarea></label>
    <button id="go">Составить план</button>
  </form>

  <div id="status"></div>
  <!-- TODO: оформите вывод плана (сейчас просто текст) -->
  <div id="plan"></div>

  <footer>Материал носит образовательный характер и не является медицинской рекомендацией.</footer>

  <script>
    "use strict";
    // ═══════════════════════════════════════════════════════════════
    // ═══ LLM: ПОДКЛЮЧЕНИЕ ══════════════════════════════════════════
    // Локальная модель (OpenAI-совместимый API, только localhost).
    // Рабочий минимум — менять не обязательно, кроме BASE_URL.
    // ═══════════════════════════════════════════════════════════════
    const BASE_URL = "http://localhost:8000/v1";

    // model id узнаём в рантайме: у профилей llama/tiny модели разные.
    async function listModels() {
      const j = await (await fetch(BASE_URL + "/models")).json();
      const id = j.data && j.data[0] && j.data[0].id;
      if (!id) throw new Error("модель не найдена");
      return id;
    }

    async function chat(model, messages) {
      const r = await fetch(BASE_URL + "/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model, messages })
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return (await r.json()).choices[0].message.content; // TODO: проверьте ответ на пустоту
    }

    // ═══════════════════════════════════════════════════════════════
    // ═══ LLM: ПРОМПТ ═══════════════════════════════════════════════
    // Сейчас минимальный — придумайте свой (по-русски, структурированный
    // план, без диагнозов и лекарств). Это оценивается жюри.
    // ═══════════════════════════════════════════════════════════════
    const SYSTEM_PROMPT =
      "Составь персональный план профилактики по целям пользователя."; // TODO: ваш промпт

    function buildPrompt(input) {
      // input = { age, activity, goals, notes }
      return "Возраст: " + input.age + ". Активность: " + input.activity +
        ". Цели: " + input.goals.join(", ") + ". " + input.notes; // TODO: соберите подробнее
    }

    // ═══════════════════════════════════════════════════════════════
    // ═══ SAFETY: RED FLAGS ═════════════════════════════════════════
    // Проверка ДО любого запроса к LLM (совпадение → совет врача).
    // Сейчас минимум — расширьте по списку из TASK.md §6.2.
    // ═══════════════════════════════════════════════════════════════
    const RED_FLAGS = [
      /боль\s+в\s+груд[и]/i,
      /суицид|покончить\s+с\s+собой/i
    ];
    function isRedFlag(text) {
      return RED_FLAGS.some(re => re.test(text)); // TODO: расширьте список выше
    }

    // ═══════════════ UI (минимум — сделайте свой) ══════════════════
    const $ = id => document.getElementById(id);

    $("fh").addEventListener("submit", async ev => {
      ev.preventDefault();
      const input = {
        age: $("age").value,
        activity: $("activity").value,
        goals: [...document.querySelectorAll("input[name=goal]:checked")].map(el => el.value),
        notes: $("notes").value
      };

      // red flags — до обращения к модели:
      if (isRedFlag(input.notes)) {
        $("banner").style.display = "block";
        return;
      }
      $("banner").style.display = "none";
      $("plan").textContent = "";
      $("go").disabled = true;
      $("status").textContent = "Ждём локальную модель — это может занять десятки секунд…";

      try {
        const model = await listModels();
        const reply = await chat(model, [
          { role: "system", content: SYSTEM_PROMPT },
          { role: "user", content: buildPrompt(input) }
        ]);
        $("plan").textContent = reply; // TODO: оформите красивый вывод
        $("status").textContent = "";
      } catch (err) {
        $("status").textContent = "Ошибка: " + err.message + " — LLM запущен на " + BASE_URL + "?";
      } finally {
        $("go").disabled = false;
      }
    });
  </script>
</body>
</html>
